<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Sfere weekly funnel for the last 7, 14 and 30 days, by source tab.">
<title>Sfere Weekly Funnel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23764ff6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #09090d; --surface-1: #14121e;
  --text-primary: #f3f2f8; --text-secondary: #a6a3b8; --text-muted: #8f8ca3;
  --grid: #2a2538; --border: #2a2538; --hover: #1b1826;
  --brand: #764ff6; --brand-soft: #d6c7fc;
  --stage-1: #5b3fd2; --stage-2: #6a47e6; --stage-3: #764ff6; --stage-4: #926bf7; --stage-5: #b399fb; --stage-6: #d6c7fc;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--text-primary);
  font: 14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding: var(--s5) var(--s4) 48px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--brand-soft); outline-offset: 2px; }

header { margin-bottom: var(--s5); }
h1 { font-size: 22px; line-height: 1.25; font-weight: 600; margin: 0 0 var(--s4); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px var(--s2); border-radius: 999px; background: none; color: var(--text-secondary);
  border: 1px solid var(--border); margin-left: var(--s2); vertical-align: 3px; }
.controls { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; }
.seg { max-width: 100%; overflow-x: auto; display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-1); }
.seg button { min-height: 36px; border: 0; background: none; color: var(--text-secondary); padding: 0 var(--s4); border-radius: 999px;
  font: inherit; cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--text-primary); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
@media (pointer: coarse) { .seg button { min-height: 44px; } }
[hidden] { display: none !important; }
.asof { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.notice { margin: 0 0 var(--s4); padding: var(--s3) var(--s4); border: 1px solid rgba(250,178,25,.45); border-radius: var(--radius);
  background: rgba(250,178,25,.08); color: var(--text-primary); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s4); }
a.kpi { color: inherit; text-decoration: none; }
a.kpi:hover { border-color: #4a4560; }
.kpi .l { color: var(--text-secondary); font-size: 13px; }
.kpi .v { font-size: 26px; font-weight: 600; color: var(--brand-soft); line-height: 1.2; margin: var(--s1) 0; font-variant-numeric: tabular-nums; }
.kpi .s { color: var(--text-muted); font-size: 12px; }

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: var(--s4); }
.card:last-child { margin-bottom: 0; }
.card h2 { font-size: 15px; margin: 0 0 var(--s4); font-weight: 600; }

/* funnel: wide = tapered SVG, narrow = stacked bars */
#funnel svg text { font-size: 12px; fill: var(--text-muted); }
#funnel svg text.lbl { font-size: 13px; fill: var(--text-secondary); }
#funnel svg text.fp { font-size: 20px; font-weight: 600; fill: var(--text-primary); }
#funnel svg text.cnt { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
.fseg:hover { opacity: .85; }
.flist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4); }
.fitem { display: grid; gap: 6px; }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
.fname { color: var(--text-secondary); }
.fval { font-variant-numeric: tabular-nums; }
.fval b { font-weight: 600; margin-left: var(--s2); }
.ftrack { height: 12px; }
.fbar { height: 100%; min-width: 3px; border-radius: 0 6px 6px 0; }
.fstep { color: var(--text-muted); font-size: 12px; }

#tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: var(--s2) 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; z-index: 10; max-width: 240px; }
#tip b { display: block; margin-bottom: 2px; }
#tip div { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .asof { margin-left: 0; width: 100%; }
  h1 { font-size: 20px; }
  .card { padding: var(--s4); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sfere Weekly Funnel <span class="badge" id="fakeBadge" hidden>Fake data</span></h1>
    <div class="controls">
      <div class="seg" id="srcSeg" role="group" aria-label="Source tab"></div>
      <div class="seg" id="winSeg" role="group" aria-label="Time window"></div>
      <span class="asof" id="asOf"></span>
    </div>
  </header>

  <main>
    <p class="notice" id="notice" role="status" hidden></p>
    <div class="kpis" id="kpis"></div>

    <section class="card" aria-labelledby="fTitle">
      <h2 id="fTitle">Funnel</h2>
      <div id="funnel"></div>
    </section>

    <section class="card" id="deadCard" aria-labelledby="dTitle">
      <h2 id="dTitle">Dead</h2>
      <div class="kpis" id="deadBox"></div>
    </section>
  </main>
</div>
<div id="tip"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
window.DATA = __DATA__;
</script>
<script>
const D = window.DATA;
const $ = s => document.querySelector(s);
const state = { source: 'All', days: 'all' };

const DAY = 864e5;
const dayNum = iso => Date.parse(iso + 'T00:00:00Z') / DAY;
/* days ago relative to the report date: 0 = today */
const ago = iso => dayNum(D.asOf) - dayNum(iso);
const inWindow = (iso, from, to) => ago(iso) >= from && ago(iso) <= to;
const winLabel = d => d === 'all' ? 'All time' : 'Last ' + d + ' days';
const pct = (n, d) => d ? n / d * 100 : 0;
const fp = v => (v > 0 && v < 10 ? v.toFixed(1) : Math.round(v)) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rows() {
  return D.funnel.filter(r => (state.source === 'All' || r.source === state.source)
    && (state.days === 'all' || inWindow(r.day, 0, state.days - 1)));
}
function sum(rs) {
  const o = {}; D.keys.forEach(k => o[k] = 0);
  rs.forEach(r => D.keys.forEach(k => o[k] += r[k]));
  return o;
}
/* LinkedIn tab: top of the funnel from HeyReach campaign activity; Demo, Won and Dead from the sheet's LinkedIn tab */
const LI_STAGES = [{ key: 'sent', label: 'Requests sent' }, { key: 'accepted', label: 'Accepted' },
  { key: 'messaged', label: 'Messages started' }, { key: 'replied', label: 'Replies' },
  { key: 'meeting', label: 'Demo' }, { key: 'won', label: 'Won' }];
const isLI = () => state.source === 'LinkedIn';
const hrView = () => isLI() && !!D.heyreach;
const stages = () => hrView() ? LI_STAGES : D.stages;
function liTotals() {
  const t = { ...sum(rows()), sent: 0, accepted: 0, messaged: 0, replied: 0 };
  Object.entries(D.heyreach.daily).forEach(([d, v]) => {
    if (state.days !== 'all' && !inWindow(d, 0, state.days - 1)) return;
    t.sent += v.connections_sent; t.accepted += v.connections_accepted; t.messaged += v.messages_started; t.replied += v.replies;
  });
  t.added = t.sent;
  return t;
}
const scope = () => hrView() ? liTotals() : sum(rows());
const scopeLabel = () => winLabel(state.days) + (state.source === 'All' ? '' : ' · ' + state.source);

/* ---- tooltip (wide funnel only) ---- */
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + 'px';
  tip.style.top = Math.min(y + 14, innerHeight - h - 8) + 'px';
}
const hideTip = () => tip.style.display = 'none';

/* ---- controls: built once so keyboard focus survives updates ---- */
function initControls() {
  $('#srcSeg').innerHTML = ['All', ...D.sources].map(v => `<button type="button" data-src="${v}">${v}</button>`).join('');
  $('#winSeg').innerHTML = [...D.windows, 'all'].map(d => `<button type="button" data-days="${d}">${winLabel(d)}</button>`).join('');
}
function syncControls() {
  document.querySelectorAll('#srcSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.src === state.source)));
  document.querySelectorAll('#winSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.days === String(state.days))));
}
$('#srcSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.source = b.dataset.src; render(true);
});
$('#winSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.days = b.dataset.days === 'all' ? 'all' : +b.dataset.days; render(true);
});

/* ---- KPIs ---- */
function renderKPIs() {
  const t = scope();
  const tiles = hrView()
    ? LI_STAGES.map((s, i) => [s.label, t[s.key].toLocaleString(), i ? fp(pct(t[s.key], t.sent)) + ' of requests' : scopeLabel()])
    : [
      ['Leads', t.added.toLocaleString(), scopeLabel()],
      ['Connected', fp(pct(t.message_sent, t.added)), t.message_sent + ' of ' + t.added],
      ['Replied', fp(pct(t.replied, t.added)), t.replied + ' of ' + t.added],
      ['Demos', t.meeting.toLocaleString(), fp(pct(t.meeting, t.added)) + ' of leads'],
      ['Won', t.won.toLocaleString(), fp(pct(t.won, t.added)) + ' of leads'],
    ];
  $('#kpis').innerHTML = tiles.map(([l, v, s]) =>
    `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join('');
}

/* ---- funnel ---- */
const WIDE = 860;
let funnelMode = null;
const modeNow = () => $('#funnel').clientWidth >= WIDE ? 'wide' : 'narrow';

function funnelList(t) {
  const S = stages();
  return '<ul class="flist">' + S.map((s, i) => {
    const v = t[s.key], prev = i ? S[i - 1] : null;
    return `<li class="fitem"><div class="fhead"><span class="fname">${s.label}</span><span class="fval">${v.toLocaleString()}<b>${fp(pct(v, t.added))}</b></span></div>`
      + `<div class="ftrack"><div class="fbar" style="width:${pct(v, t.added)}%;background:var(--stage-${i + 1})"></div></div>`
      + (prev ? `<div class="fstep">${fp(pct(v, t[prev.key]))} of ${prev.label}</div>` : '') + '</li>';
  }).join('') + '</ul>';
}

function funnelSvg(t) {
  const S = stages();
  const W = 1000, H = 320, x0 = 20, x1 = 900, cy = 172, hmax = 190, hmin = 5, endH = 30;
  const n = S.length, sw = (x1 - x0) / n;
  const hh = v => Math.max(hmin, t.added ? v / t.added * hmax : hmin);
  const hs = S.map(s => hh(t[s.key]));
  let out = '';
  S.forEach((s, i) => {
    const xa = x0 + i * sw, xb = xa + sw, mid = xa + sw / 2;
    const ha = hs[i], hb = i < n - 1 ? hs[i + 1] : endH, v = t[s.key];
    out += `<path class="fseg" data-i="${i}" fill="var(--stage-${i + 1})" stroke="var(--surface-1)" stroke-width="2" stroke-linejoin="round"
      d="M${xa},${cy - ha / 2} L${xb},${cy - hb / 2} L${xb},${cy + hb / 2} L${xa},${cy + ha / 2} Z"/>`;
    out += `<text class="fp" x="${mid}" y="26" text-anchor="middle">${fp(pct(v, t.added))}</text>`
         + `<text class="lbl" x="${mid}" y="45" text-anchor="middle">${s.label}</text>`
         + `<text x="${mid}" y="62" text-anchor="middle">${v.toLocaleString()}</text>`;
    if (i) out += `<text x="${mid}" y="${H - 8}" text-anchor="middle">${fp(pct(v, t[S[i - 1].key]))} of previous</text>`;
  });
  const last = S[n - 1];
  out += `<text x="${x1 + 44}" y="${cy - 46}" text-anchor="middle">${last.label}</text>`
       + `<circle cx="${x1 + 44}" cy="${cy}" r="36" fill="var(--surface-1)" stroke="var(--stage-1)" stroke-width="2"/>`
       + `<text class="cnt" x="${x1 + 44}" y="${cy + 5}" text-anchor="middle">${t[last.key].toLocaleString()}</text>`;
  const sr = '<ul class="sr-only">' + S.map(s =>
    `<li>${s.label}: ${t[s.key].toLocaleString()} (${fp(pct(t[s.key], t.added))} of ${hrView() ? 'requests' : 'added'})</li>`).join('') + '</ul>';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">${out}</svg>${sr}`;
}

function renderFunnel() {
  const t = scope();
  $('#fTitle').textContent = 'Funnel \u00b7 ' + scopeLabel();
  funnelMode = modeNow();
  $('#funnel').innerHTML = funnelMode === 'wide' ? funnelSvg(t) : funnelList(t);
}
new ResizeObserver(() => { if (modeNow() !== funnelMode) renderFunnel(); }).observe($('#funnel'));

$('#funnel').addEventListener('mousemove', e => {
  const r = e.target.closest('.fseg'); if (!r) return hideTip();
  const S = stages(), t = scope(), i = +r.dataset.i, s = S[i], v = t[s.key];
  let h = `<b>${s.label}</b><div>${v.toLocaleString()} of ${t.added.toLocaleString()} (${fp(pct(v, t.added))})</div>`;
  if (i) { const p = S[i - 1]; h += `<div>${fp(pct(v, t[p.key]))} of ${p.label}; ${(t[p.key] - v).toLocaleString()} dropped here</div>`; }
  showTip(h, e.clientX, e.clientY);
});
$('#funnel').addEventListener('mouseleave', hideTip);

/* ---- Dead: leads with status Not interested. Note text stays in the private sheet; only counts are published. ---- */
function renderDead() {
  const t = scope();
  $('#deadBox').innerHTML = `<div class="kpi"><div class="l">Dead leads (Not interested)</div><div class="v">${t.dead.toLocaleString()}</div></div>`
    + `<a class="kpi" href="${esc(D.sheetUrl)}" target="_blank" rel="noopener"><div class="l">Why are they dead?</div><div class="v">Notes</div></a>`;
}

function render(announce) {
  syncControls(); renderKPIs(); renderFunnel(); renderDead();
  if (announce) $('#live').textContent = 'Showing ' + scopeLabel() + ': ' + scope().added.toLocaleString() + ' leads';
}
$('#fakeBadge').hidden = !D.fake;
$('#asOf').textContent = 'Updated ' + new Date(D.asOf + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
if (D.unmapped.length) {
  $('#notice').hidden = false;
  $('#notice').textContent = 'Not in the funnel yet: ' + D.unmapped.join(', ') + '. These statuses are counted as Leads only until they are mapped to a stage.';
}
initControls();
render(false);
</script>
</body>
</html>
