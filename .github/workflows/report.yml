name: Build and publish funnel report

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEMO: "0"   # "1" = fake demo data, "0" = real sheet data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build database and report
        run: |
          # DEMO=1 builds the fake-data demo. DEMO=0 builds ONLY from real sheet snapshots and fails if there are none,
          # so fake data can never appear on the page by accident.
          if [ "$DEMO" = "1" ]; then
            python seed_fake_data.py
          elif ls data/snapshots/*.csv >/dev/null 2>&1; then
            python ingest.py
          else
            echo "DEMO is 0 but data/snapshots has no CSV files" >&2
            exit 1
          fi
          python report.py
          # Sample page with FAKE data, always published at /demo/ and labeled "Fake data". The real report stays at the main link.
          python seed_fake_data.py
          REPORT_OUT=site/demo/index.html python report.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
